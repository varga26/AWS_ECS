global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'ecs-services'
    ecs_sd_configs:
      - region: us-east-1
    relabel_configs:
      - source_labels: [__meta_ecs_cluster]
        action: keep
        regex: llm-ecs-cluster
      - source_labels: [__meta_ecs_service]
        action: keep
        regex: ollama-service
      - source_labels: [__meta_ecs_ip_address]
        target_label: __address__
        replacement: "${1}:11434"
