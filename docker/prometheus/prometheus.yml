global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: 'ollama-metrics'
    metrics_path: /metrics
    dns_sd_configs:
      - names: ['ollama.ecs.local']
        type: 'A'
        port: 8080
    relabel_configs:
      - source_labels: [__address__]
        regex: '^10\.0\.0\.([0-9]|[12][0-9]|3[01])(?::\d+)?$'
        target_label: cloud_availability_zone
        replacement: 'us-east-1a'
      - source_labels: [__address__]
        regex: '^10\.0\.0\.(3[2-9]|[45][0-9]|6[0-3])(?::\d+)?$'
        target_label: cloud_availability_zone
        replacement: 'us-east-1b'

  - job_name: 'openwebui-metrics'
    metrics_path: /metrics
    dns_sd_configs:
      - names: ['openwebui.ecs.local']
        type: 'A'
        port: 9090
    relabel_configs:
      - source_labels: [__address__]
        regex: '^10\.0\.0\.([0-9]|[12][0-9]|3[01])(?::\d+)?$'
        target_label: cloud_availability_zone
        replacement: 'us-east-1a'
      - source_labels: [__address__]
        regex: '^10\.0\.0\.(3[2-9]|[45][0-9]|6[0-3])(?::\d+)?$'
        target_label: cloud_availability_zone
        replacement: 'us-east-1b'

  - job_name: 'prometheus'
    metrics_path: /prometheus/metrics
    dns_sd_configs:
      - names: ['prometheus.ecs.local']
        type: 'A'
        port: 9090
    relabel_configs:
      - source_labels: [__address__]
        regex: '^10\.0\.0\.([0-9]|[12][0-9]|3[01])(?::\d+)?$'
        target_label: cloud_availability_zone
        replacement: 'us-east-1a'
      - source_labels: [__address__]
        regex: '^10\.0\.0\.(3[2-9]|[45][0-9]|6[0-3])(?::\d+)?$'
        target_label: cloud_availability_zone
        replacement: 'us-east-1b'

  - job_name: 'ecs-metrics'
    metrics_path: /metrics
    dns_sd_configs:
      - names: 
          - 'ollama.ecs.local'
          - 'openwebui.ecs.local'
          - 'prometheus.ecs.local'
          - 'grafana.ecs.local'
        type: 'A'
        port: 20000
    relabel_configs:
      - source_labels: [__address__]
        regex: '^10\.0\.0\.([0-9]|[12][0-9]|3[01])(?::\d+)?$'
        target_label: cloud_availability_zone
        replacement: 'us-east-1a'
      - source_labels: [__address__]
        regex: '^10\.0\.0\.(3[2-9]|[45][0-9]|6[0-3])(?::\d+)?$'
        target_label: cloud_availability_zone
        replacement: 'us-east-1b'

